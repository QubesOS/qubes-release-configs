# Configuration for qubes build server: Qubes R4.3 - templates-itl

include:
 - /home/user/qubes-builderv2/example-configs/qubes-os-main.yml

gpg-client: qubes-gpg-client-wrapper
repository-publish:
  components: current-testing
  templates: templates-itl-testing

use-qubes-repo:
  version: 'devel'
  testing: true

fetch-versions-only: true
increment-devel-versions: true
reuse-fetched-source: true

distributions: []

components:
  - release-configs:
      fetch-versions-only: false
      branch: main
  - builder-rpm:
      packages: False
      fetch-versions-only: false
      branch: main
  - builder-debian:
      packages: False
      fetch-versions-only: false
      branch: main

templates:
  - fedora-41:
      dist: fc41
      options:
       - selinux
      timeout: 7200
  - fedora-41-xfce:
      dist: fc41
      options:
       - selinux
      timeout: 7200
      flavor: xfce
  - fedora-41-minimal:
      dist: fc41
      timeout: 7200
      flavor: minimal
  - fedora-42:
      dist: fc42
      options:
       - selinux
      timeout: 7200
  - fedora-42-xfce:
      dist: fc42
      options:
       - selinux
      timeout: 7200
      flavor: xfce
  - fedora-42-minimal:
      dist: fc42
      timeout: 7200
      flavor: minimal
  - fedora-43:
      dist: fc43
      options:
       - selinux
      timeout: 7200
  - fedora-43-xfce:
      dist: fc43
      options:
       - selinux
      timeout: 7200
      flavor: xfce
  - fedora-43-minimal:
      dist: fc43
      timeout: 7200
      flavor: minimal
  - fedora-44-gnome:
      dist: fc44
      options:
       - selinux
      timeout: 7200
  - fedora-44-xfce:
      dist: fc44
      options:
       - selinux
      timeout: 7200
      flavor: xfce
  - fedora-44-minimal:
      dist: fc44
      timeout: 7200
      flavor: minimal
  - fedora-45-gnome:
      dist: fc45
      options:
       - selinux
      timeout: 7200
  - fedora-45-xfce:
      dist: fc45
      options:
       - selinux
      timeout: 7200
      flavor: xfce
  - fedora-45-minimal:
      dist: fc45
      timeout: 7200
      flavor: minimal
  - debian-12:
      dist: bookworm
      flavor: gnome
      options:
        - firmware
      timeout: 7200
  - debian-12-minimal:
      dist: bookworm
      flavor: minimal
      options:
        - no-recommends
      timeout: 7200
  - debian-12-xfce:
      dist: bookworm
      flavor: xfce
      options:
        - firmware
      timeout: 7200
  - debian-13:
      dist: trixie
      flavor: gnome
      options:
        - firmware
      timeout: 7200
  - debian-13-minimal:
      dist: trixie
      flavor: minimal
      options:
        - no-recommends
      timeout: 7200
  - debian-13-xfce:
      dist: trixie
      flavor: xfce
      options:
        - firmware
      timeout: 7200

sign-key:
  rpm: '02B0F900BE18482CC01FA754C7ABBE591CBE626C'

repository-upload-remote-host:
  rpm: 'yum.qubes-os.org:/pub/qubes/repo/yum/devel'

github:
  maintainers:
    # marmarek
    '17B7CC1986BD3D28C41475B6846D6B709C6E2E7F':
      templates: _all_
    # simon
    '274E12AB03F2FE293765FC06DA0434BC706E1FCF':
